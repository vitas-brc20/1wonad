<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>

  <!-- 외부 황금빛 1원 코인 테두리 -->
  <circle cx="256" cy="275" r="165" fill="#141416" stroke="url(#gold)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="256" cy="275" r="148" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- 상단 왕관 심볼 (점령의 상징) -->
  <path d="M 186 165 L 212 205 L 256 155 L 300 205 L 326 165 L 316 220 L 196 220 Z" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="186" cy="160" r="7" fill="#fef08a"/>
  <circle cx="256" cy="150" r="9" fill="#fef08a"/>
  <circle cx="326" cy="160" r="7" fill="#fef08a"/>

  <!-- 중앙 1원 네온 텍스트 -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="130" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="-2" filter="url(#glow)">1₩</text>

  <!-- 전광판 네온 도트 라이트 -->
  <circle cx="135" cy="275" r="5" fill="url(#neonGreen)"/>
  <circle cx="377" cy="275" r="5" fill="url(#neonGreen)"/>
  <circle cx="256" cy="396" r="5" fill="url(#neonGreen)"/>
</svg>
